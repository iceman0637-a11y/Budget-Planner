<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Budget Planner</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="text">
            <h1>Welcome to Budget planner.</h1>
            <h2>Enter your monthly income to see your plan!</h2>
            <p></p>
        </div>
        <div class="calculations">
            <input id="paycheck" type="number" placeholder="Your Paycheck">
            <button id="calculate">Calculate</button>
        </div>
        <div class="results">  
            <p>Needs: <span id="needs">0</span>$</p>
            <p>Wants: <span id="wants">0</span>$</p>
            <p>Savings: <span id="savings">0</span>$</p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
